# paper/references.yaml -- the single source of truth for the paper's bibliography.
#
# How this bibliography was built (copied verbatim from the former hand-written
# paper/bibliography.md; the extraction rule is unchanged):
#
# **How this bibliography was built.** Every field in every entry below was read
# directly off the document itself — a title page, copyright page, journal running
# head, or arXiv identifier line — in a file held under `paper_research/source_pdfs/`.
# No field was supplied from memory, from inference, or from an external bibliographic
# database. Where a source does not print a field, the field is **omitted** rather than
# reconstructed, and the entry carries a bracketed note naming exactly what is missing.
# A thin entry is therefore never mistaken for a checked one.
#
# SCHEMA. One entry per work, CSL-JSON field names (id, type, author, editor,
# translator, issued, original-date, title, container-title, volume, issue, page,
# number, publisher, publisher-place, DOI, URL, edition, genre). `id` is the
# citation key: lowercase <firstauthorfamily><year>[a-z], ASCII-folded; a trailing
# letter is the year suffix and is what prints as 2026a/2026b/2026c.
# Project fields, carried through to the printed bibliography unchanged:
#   provenance              verbatim residue of the entry that is not a CSL field
#                           (affiliations, dates received, ISBNs, identifiers, notes)
#   metadata_incomplete     verbatim text of the entry's "Metadata incomplete" note
#                           (rendered as *[...]*); it is also what permits an entry that
#                           lacks author / title / issued to render at all
#   provenance_zh, metadata_incomplete_zh
#                           the Chinese render's counterparts of the two above
# A field the source document does not print is OMITTED, never reconstructed.

